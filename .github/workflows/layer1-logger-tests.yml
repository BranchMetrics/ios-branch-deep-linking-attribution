name: Layer 1 - SDK Wire Validation (iOS PR Gate)

# Ported from master. The master copy already lists `4.0.0-beta.*` as a base,
# but a workflow only runs if it exists in the PR's merge tree, so the file has
# to live on this line too. Without it the L1 scripts on this branch are run by
# nothing.

on:
  # The ticket's acceptance is that a push to the beta triggers this, and the
  # badges in EMT-4080 read a branch status, which only a push event produces.
  # A PR-only trigger leaves both unmet.
  push:
    branches:
      - "4.0.0-beta.*"
    paths:
      - "Sources/BranchSDK/**"
      - "Sources/BranchSwiftSDK/**"
      - "Branch-TestBed/**"
      - ".github/workflows/layer1-logger-tests.yml"
      - "scripts/validate_l1_logs.py"
      - "scripts/check_foreground_markers.py"
      - "scripts/test_validate_l1_logs.py"
      - "scripts/test_validate_l1_logs_contracts.py"
      - "scripts/test_check_foreground_markers.py"
      - "scripts/fixtures/**"
      - "scripts/run_l1_instrumented.sh"
      - "scripts/run_h2_hot.sh"
  pull_request:
    branches:
      - "4.0.0-beta.*"
    # Duplicated rather than shared via a YAML anchor: GitHub Actions does not
    # guarantee anchor support, and a silently dead trigger is the worst
    # failure mode for a gate.
    paths:
      - "Sources/BranchSDK/**"
      - "Sources/BranchSwiftSDK/**"
      - "Branch-TestBed/**"
      - ".github/workflows/layer1-logger-tests.yml"
      - "scripts/validate_l1_logs.py"
      - "scripts/check_foreground_markers.py"
      - "scripts/test_validate_l1_logs.py"
      - "scripts/test_validate_l1_logs_contracts.py"
      - "scripts/test_check_foreground_markers.py"
      - "scripts/fixtures/**"
      - "scripts/run_l1_instrumented.sh"
      - "scripts/run_h2_hot.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: l1-ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-wire-logs:
    runs-on: macos-15
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode (16.4 or later 16.x)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "^16.4"

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | tail -10

      # Resolve the simulator name from the runner rather than hardcoding one.
      # `name=iPhone 16,OS=latest` fails whenever the image ships that device
      # only on an older runtime — the destination resolves to nothing and the
      # build errors out. verify.yml already solves it this way.
      - name: Resolve simulator
        id: sim
        run: |
          ./scripts/getSimulator
          echo "name=$(cat ./iphoneSim)" >> "$GITHUB_OUTPUT"

      - name: Build TestBed for testing
        run: |
          xcodebuild build-for-testing \
            -project Branch-TestBed/Branch-TestBed.xcodeproj \
            -scheme TestBed-GPTDriverTests \
            -derivedDataPath ./DerivedData \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }},OS=latest" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Run L1 instrumentation
        env:
          DERIVED_DATA_DIR: ./DerivedData
          SIM_NAME: ${{ steps.sim.outputs.name }}
          SIM_OS: latest
          PROJECT_PATH: Branch-TestBed/Branch-TestBed.xcodeproj
          SCHEME: TestBed-GPTDriverTests
          ONLY_TESTING: TestBed-GPTDriverTests/L1WireValidationTest
          BUNDLE_ID: io.branch.sdk.Branch-TestBed
          OUTPUT_LOG: branchlogs.txt
        run: ./scripts/run_l1_instrumented.sh

      # hot_uriScheme on the same device. The driver reinstalls the TestBed,
      # so the install capture above is already copied out. Only receipt lines
      # are printed; the captures stay in /tmp/h2 and are never uploaded.
      - name: Capture hot_uriScheme
        id: h2capture
        continue-on-error: true
        env:
          DERIVED_DATA_DIR: ./DerivedData
          SIM_NAME: ${{ steps.sim.outputs.name }}
          BUNDLE_ID: io.branch.sdk.Branch-TestBed
          OUTPUT_DIR: /tmp/h2
          H2_EXPECT_RUNTIME: iOS-18-5
          H2_URL: branchtest://open?scenario=H2
        run: |
          # A marker left by an earlier run would carve out this one too, and
          # it would read as "not run" while asserting nothing.
          rm -f /tmp/h2-runtime-missing
          rc=0
          ./scripts/run_h2_hot.sh > /tmp/h2-driver.txt 2>&1 || rc=$?
          grep -E '^(RUNTIME=|consent key: |settled after |openurl attempt |pid unchanged$|ERROR: )' /tmp/h2-driver.txt || true
          if grep -q '^ERROR: no available .* on runtime ' /tmp/h2-driver.txt; then
            touch /tmp/h2-runtime-missing
          fi
          [ "$rc" -eq 0 ] || { echo "ERROR: driver exited $rc"; exit "$rc"; }

      # The same driver in warm mode: the app is backgrounded with Preferences
      # before the pre snapshot, so the delivery reaches a live, background process.
      - name: Capture warm_uriScheme
        id: w2capture
        continue-on-error: true
        env:
          DERIVED_DATA_DIR: ./DerivedData
          SIM_NAME: ${{ steps.sim.outputs.name }}
          BUNDLE_ID: io.branch.sdk.Branch-TestBed
          OUTPUT_DIR: /tmp/w2
          H2_EXPECT_RUNTIME: iOS-18-5
          H2_URL: branchtest://open?scenario=W2
          WARM: "1"
          CAPTURE_NAME: wire-warm_uriScheme
        run: |
          # Same reason as the hot step: a stale marker disarms this gate.
          rm -f /tmp/w2-runtime-missing
          rc=0
          ./scripts/run_h2_hot.sh > /tmp/w2-driver.txt 2>&1 || rc=$?
          grep -E '^(RUNTIME=|consent key: |settled after |openurl attempt |backgrounded, pid unchanged$|pid unchanged$|ERROR: )' /tmp/w2-driver.txt || true
          if grep -q '^ERROR: no available .* on runtime ' /tmp/w2-driver.txt; then
            touch /tmp/w2-runtime-missing
          fi
          [ "$rc" -eq 0 ] || { echo "ERROR: driver exited $rc"; exit "$rc"; }

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      # Self-test first: a regression in the validator would otherwise surface
      # as a false PASS on the real capture.
      - name: Run L1 validator unit tests
        run: python3 -m unittest discover -s scripts -p "test_*.py" -v

      # continue-on-error so the summary below still runs on a failure — the
      # job is failed explicitly at the end.
      #
      # The scenario is required on this line: a capture is judged against the
      # contract for the run that produced it. This job drives the default
      # harness run, which is install: one open, no deep link.
      - name: Validate wire logs
        id: validate
        continue-on-error: true
        run: |
          set -o pipefail
          python3 scripts/validate_l1_logs.py branchlogs.txt --scenario install 2>&1 | tee /tmp/l1-output.txt

      # The wire contract counts the delivery delta, and the marker checker
      # proves the app stayed foreground across it. Both print payloads or
      # counts, so only their verdict lines reach the log.
      - name: Validate hot_uriScheme
        id: h2
        continue-on-error: true
        env:
          OUTPUT_DIR: /tmp/h2
          H2_URL: branchtest://open?scenario=H2
        run: |
          tag="[hot_uriScheme]"
          # An image without the pinned runtime is not an SDK failure. The
          # capture step leaves this marker for that one driver error only.
          if [ -f /tmp/h2-runtime-missing ]; then
            echo "$tag not run: no simulator on the expected runtime" | tee /tmp/h2-output.txt
            exit 0
          fi
          if [ "${{ steps.h2capture.outcome }}" != "success" ]; then
            echo "FAILED: $tag driver failed; see the capture step log" | tee /tmp/h2-output.txt
            exit 1
          fi
          post="$OUTPUT_DIR/wire-hot_uriScheme.post.txt"
          pre="$OUTPUT_DIR/wire-hot_uriScheme.pre.txt"
          rc=0
          python3 scripts/validate_l1_logs.py "$post" --scenario hot_uriScheme \
            --pre "$pre" --url "$H2_URL" > /tmp/h2-validate.txt 2>&1 || rc=1
          python3 scripts/check_foreground_markers.py "$post" --pre "$pre" \
            > /tmp/h2-markers.txt 2>&1 || rc=1
          {
            grep -E '^(FAILED:|--- VALIDATION)' /tmp/h2-validate.txt || true
            grep -E '^(FAILED:|pre: |delta: )' /tmp/h2-markers.txt || true
          } | sed "s/^FAILED: /FAILED: $tag /" | tee /tmp/h2-output.txt
          if [ "$rc" -ne 0 ] && ! grep -q '^FAILED:' /tmp/h2-output.txt; then
            echo "FAILED: $tag a checker exited without a verdict" | tee -a /tmp/h2-output.txt
          fi
          exit "$rc"

      # The warm contract bounds the open count and the checker reads the last
      # transition marker in pre, which is what tells a warm delivery from a hot one.
      - name: Validate warm_uriScheme
        id: w2
        continue-on-error: true
        env:
          OUTPUT_DIR: /tmp/w2
          H2_URL: branchtest://open?scenario=W2
        run: |
          tag="[warm_uriScheme]"
          # Same carve-out as the hot step: the marker means the image, not the SDK.
          if [ -f /tmp/w2-runtime-missing ]; then
            echo "$tag not run: no simulator on the expected runtime" | tee /tmp/w2-output.txt
            exit 0
          fi
          if [ "${{ steps.w2capture.outcome }}" != "success" ]; then
            echo "FAILED: $tag driver failed; see the capture step log" | tee /tmp/w2-output.txt
            exit 1
          fi
          post="$OUTPUT_DIR/wire-warm_uriScheme.post.txt"
          pre="$OUTPUT_DIR/wire-warm_uriScheme.pre.txt"
          rc=0
          python3 scripts/validate_l1_logs.py "$post" --scenario warm_uriScheme \
            --pre "$pre" --url "$H2_URL" > /tmp/w2-validate.txt 2>&1 || rc=1
          python3 scripts/check_foreground_markers.py "$post" --pre "$pre" \
            --scenario warm_uriScheme > /tmp/w2-markers.txt 2>&1 || rc=1
          {
            grep -E '^(FAILED:|--- VALIDATION)' /tmp/w2-validate.txt || true
            grep -E '^(FAILED:|pre: |delta: |pre last transition: )' /tmp/w2-markers.txt || true
          } | sed "s/^FAILED: /FAILED: $tag /" | tee /tmp/w2-output.txt
          if [ "$rc" -ne 0 ] && ! grep -q '^FAILED:' /tmp/w2-output.txt; then
            echo "FAILED: $tag a checker exited without a verdict" | tee -a /tmp/w2-output.txt
          fi
          exit "$rc"

      # What the gate actually asserted, on the PR page rather than buried in
      # the job log.
      - name: Write run summary
        if: always()
        run: |
          {
            echo "### Layer 1 — SDK wire validation"
            echo
            grep -o 'Got https://[^ ]*' branchlogs.txt 2>/dev/null \
              | sed 's|.*api2.branch.io||' | sort | uniq -c > /tmp/l1-endpoints.txt || true
            if [ -s /tmp/l1-endpoints.txt ]; then
              echo "| endpoint | requests |"
              echo "| --- | ---: |"
              awk '{printf "| `%s` | %s |\n", $2, $1}' /tmp/l1-endpoints.txt
            else
              echo "No wire requests were captured."
            fi
            echo
            echo "Scenario coverage:"
            echo
            echo "The endpoint table counts the install capture."
            echo "install, hot_uriScheme and warm_uriScheme are the contracts this gate asserts."
            echo
            echo "| scenario group | status |"
            echo "| --- | --- |"
            echo "| Cold | not implemented |"
            no_runtime="the runner has no simulator on the expected runtime"
            hot_defer="hot_https_foreground deferred until CI builds are signed"
            hot_retake="measure hot_uriScheme on the new runtime, then update H2_EXPECT_RUNTIME"
            warm_defer="warm_https_onNewIntent not implemented"
            warm_retake="measure warm_uriScheme on the new runtime, then update H2_EXPECT_RUNTIME"
            if [ -f /tmp/w2-runtime-missing ]; then
              echo "| Warm | warm_uriScheme not run: $no_runtime ($warm_retake); $warm_defer |"
            elif [ "${{ steps.w2.outcome }}" = "success" ]; then
              echo "| Warm | warm_uriScheme pass (at most 2 opens until the SDK fix); $warm_defer |"
            elif [ "${{ steps.w2.outcome }}" = "failure" ]; then
              echo "| Warm | warm_uriScheme fail, see failures below; $warm_defer |"
            else
              echo "| Warm | warm_uriScheme not run; $warm_defer |"
            fi
            if [ -f /tmp/h2-runtime-missing ]; then
              echo "| Hot | hot_uriScheme not run: $no_runtime ($hot_retake); $hot_defer |"
            elif [ "${{ steps.h2.outcome }}" = "success" ]; then
              echo "| Hot | hot_uriScheme pass; $hot_defer |"
            elif [ "${{ steps.h2.outcome }}" = "failure" ]; then
              echo "| Hot | hot_uriScheme fail, see failures below; $hot_defer |"
            else
              echo "| Hot | hot_uriScheme not run; $hot_defer |"
            fi
            echo "| Negative and guards | not implemented |"
            echo
            if [ "${{ steps.validate.outcome }}" = "success" ] && [ "${{ steps.h2.outcome }}" = "success" ] && [ "${{ steps.w2.outcome }}" = "success" ]; then
              skipped=""
              if [ -f /tmp/h2-runtime-missing ]; then skipped="hot_uriScheme"; fi
              if [ -f /tmp/w2-runtime-missing ]; then skipped="${skipped:+$skipped and }warm_uriScheme"; fi
              echo "Result: **PASS**${skipped:+ ($skipped not run)}"
            else
              echo "Result: **FAIL**"
              echo
              echo '```'
              cat /tmp/l1-output.txt /tmp/h2-output.txt /tmp/w2-output.txt 2>/dev/null | grep '^FAILED:' || echo "(no FAILED lines; see the job log)"
              echo '```'
              # Only the install capture is rendered; hot_uriScheme captures stay off the page.
              if [ "${{ steps.validate.outcome }}" != "success" ]; then
                echo
                echo "<details><summary>Captured wire log</summary>"
                echo
                echo '```'
                if [ -s branchlogs.txt ]; then head -c 40000 branchlogs.txt; echo; else echo "(branchlogs.txt is empty or missing)"; fi
                echo '```'
                echo
                echo "</details>"
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail the job if validation failed
        if: steps.validate.outcome == 'failure'
        run: exit 1

      # Fires only for the blocking steps above; hot_uriScheme and warm_uriScheme
      # run continue-on-error, so neither publishes a capture on its own. Do not
      # widen this condition to cover those steps.
      - name: Upload wire logs on failure
        if: failure() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/upload-artifact@v4
        with:
          name: ios-wire-logs
          path: branchlogs.txt
          retention-days: 7

      # After the upload, so a hot_uriScheme-only or warm_uriScheme-only failure
      # uploads nothing.
      - name: Fail the job if hot_uriScheme failed
        if: steps.h2.outcome == 'failure'
        run: exit 1

      - name: Fail the job if warm_uriScheme failed
        if: steps.w2.outcome == 'failure'
        run: exit 1

      - name: Teardown simulator
        if: always()
        run: xcrun simctl shutdown all || true
