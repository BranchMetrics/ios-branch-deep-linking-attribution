name: Unit tests

on:
  push:
  pull_request:
    branches:
      - master

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@v6
      - name: Run unit tests
        run: |
          echo "branch=${{ github.ref }}" >> $GITHUB_OUTPUT
          ./scripts/getSimulator
          DESTINATION="platform=iOS Simulator,name=$(cat ./iphoneSim),OS=latest"
          xcodebuild test \
            -project BranchSDK.xcodeproj \
            -scheme BranchSDKTests \
            -destination "$DESTINATION" \
            -testPlan BranchSDKTests | xcpretty && exit ${PIPESTATUS[0]}

  # EMT-4476. Sibling of `verify`, not a replacement: proves the beta line
  # builds and passes on Xcode 27 without touching the Xcode 16.x leg above.
  # Non-blocking: `xcode-27` is a GitHub-documented preview runner image
  # (actions/runner-images#14404, still open, capacity/queueing caveats, no
  # committed GA date). `continue-on-error` keeps a preview-image failure
  # from failing this workflow's own run; this job is also not added as a
  # required branch-protection check. Promote once the label has proven
  # stable in practice (spec.md Open question 2).
  verify-xcode27:
    runs-on: xcode-27
    # First run: BranchSDKTests finished cleanly (690/0 in ~170s), then
    # xcodebuild itself produced no further output for ~9m42s before the
    # 20-minute job timeout force-cancelled it; GitHub's own "Cleaning up
    # orphan processes" step then had to kill xcodebuild, SWBBuildService
    # and DTServiceHub by pid, i.e. xcodebuild never returned control on its
    # own. The same step on macos-15 / Xcode 16.4 goes from "Executed N
    # tests" to the next step in ~9s, and the SDK author reports the same
    # invocation exits in ~2 minutes on a local Xcode 27 install — so this
    # is CI-runner-specific, not a code-level thread leak. Matches a known
    # class of xcodebuild/simulator-diagnostics hang in headless CI (no
    # WindowServer session): DTServiceHub can block post-test waiting on a
    # service handshake that a developer's logged-in GUI session already
    # has warm. Mitigated below by pre-booting the simulator (and waiting
    # for `bootstatus`) before xcodebuild takes over the boot-and-launch
    # sequence itself, plus explicit -resultBundlePath/-enableCodeCoverage
    # NO/-parallel-testing-enabled NO to remove any implicit-default
    # ambiguity (parallel testing and coverage were already off via the
    # test plan; passed explicitly here for certainty). 35 minutes (vs. 20
    # for `verify`) stays as a safety net in case the pre-boot does not
    # fully resolve it on the xcode-27 preview image.
    timeout-minutes: 35
    continue-on-error: true
    steps:
      - name: Check out code
        uses: actions/checkout@v6
      - name: Select Xcode 27.0
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.0"
      - name: Build BranchSDK for iOS Simulator (generic)
        run: |
          xcodebuild build \
            -project BranchSDK.xcodeproj \
            -scheme BranchSDK \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" | xcpretty && exit ${PIPESTATUS[0]}
      - name: Build BranchSDK for iOS device (generic, unsigned)
        run: |
          xcodebuild build \
            -project BranchSDK.xcodeproj \
            -scheme BranchSDK \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" | xcpretty && exit ${PIPESTATUS[0]}
      - name: Build BranchSDK-tvOS for tvOS Simulator (generic)
        run: |
          xcodebuild build \
            -project BranchSDK.xcodeproj \
            -scheme BranchSDK-tvOS \
            -destination "generic/platform=tvOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" | xcpretty && exit ${PIPESTATUS[0]}
      - name: Run unit tests
        run: |
          echo "branch=${{ github.ref }}" >> $GITHUB_OUTPUT
          ./scripts/getSimulator
          SIM_NAME="$(cat ./iphoneSim)"
          # Pre-boot the simulator and wait for it to fully settle before
          # xcodebuild takes over the boot-and-launch sequence itself. On
          # this preview image, xcodebuild's own implicit boot appears to
          # race the diagnostics-service handshake (DTServiceHub) that a
          # developer's logged-in GUI session already has warm; giving it
          # time up front is the standard mitigation for that class of hang.
          xcrun simctl boot "$SIM_NAME" || true
          xcrun simctl bootstatus "$SIM_NAME" -b
          rm -rf ./TestResults.xcresult
          DESTINATION="platform=iOS Simulator,name=$SIM_NAME,OS=latest"
          xcodebuild test \
            -project BranchSDK.xcodeproj \
            -scheme BranchSDKTests \
            -destination "$DESTINATION" \
            -testPlan BranchSDKTests \
            -resultBundlePath ./TestResults.xcresult \
            -enableCodeCoverage NO \
            -parallel-testing-enabled NO | xcpretty && exit ${PIPESTATUS[0]}
