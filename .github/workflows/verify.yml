name: Unit tests

on:
  push:
  pull_request:
    branches:
      - master

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@v6
      - name: Run unit tests
        run: |
          echo "branch=${{ github.ref }}" >> $GITHUB_OUTPUT
          ./scripts/getSimulator
          DESTINATION="platform=iOS Simulator,name=$(cat ./iphoneSim),OS=latest"
          xcodebuild test \
            -project BranchSDK.xcodeproj \
            -scheme BranchSDKTests \
            -destination "$DESTINATION" \
            -testPlan BranchSDKTests | xcpretty && exit ${PIPESTATUS[0]}

  # EMT-4476. Sibling of `verify`, not a replacement: proves the beta line
  # builds and passes on Xcode 27 without touching the Xcode 16.x leg above.
  # Non-blocking: `xcode-27` is a GitHub-documented preview runner image
  # (actions/runner-images#14404, still open, capacity/queueing caveats, no
  # committed GA date). `continue-on-error` keeps a preview-image failure
  # from failing this workflow's own run; this job is also not added as a
  # required branch-protection check. Promote once the label has proven
  # stable in practice (spec.md Open question 2).
  verify-xcode27:
    runs-on: xcode-27
    # BranchSDKTests itself finishes fast and clean (690/0, ~150-170s), but
    # the "Run unit tests" step then produces no further output for a
    # consistent ~10 minutes before xcodebuild finally returns: 9m42s (run
    # 1, force-cancelled by the then-20-minute job timeout before it could
    # finish on its own; GitHub's "Cleaning up orphan processes" step had to
    # kill xcodebuild, SWBBuildService and DTServiceHub by pid), 10m10s (run
    # 2, timeout alone widened to 35), 10m07s (run 3, same 35-minute
    # timeout, simulator pre-booted via `simctl boot`/`bootstatus` plus
    # explicit -resultBundlePath/-enableCodeCoverage NO/-parallel-testing-
    # enabled NO added to rule out implicit-default ambiguity). Neither the
    # pre-boot nor the explicit flags moved the gap at all (10m10s vs.
    # 10m07s is noise), so both were reverted rather than kept as unproven
    # complexity; the flags stay since they cost nothing and do rule out
    # coverage/parallel-testing as the cause. The same step is ~9s on
    # macos-15 / Xcode 16.4, and ~2 minutes locally on a real Xcode 27
    # install (SDK author's own measurement), so this is CI-runner-specific,
    # not a code-level thread leak, and the ~10-minute figure recurring
    # across three independent runs reads as a fixed internal
    # service-handshake or diagnostics-collection timeout inside this
    # specific xcode-27 preview image's toolchain, not something fixable
    # from this workflow file. 35 minutes (vs. 20 for `verify`) is the
    # actual, working stopgap: every run above completed successfully
    # within it, at ~17-18 minutes total.
    timeout-minutes: 35
    continue-on-error: true
    concurrency:
      group: verify-xcode27-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out code
        uses: actions/checkout@v6
      - name: Select Xcode 27.0
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.0"
      - name: Build BranchSDK for iOS Simulator (generic)
        run: |
          xcodebuild build \
            -project BranchSDK.xcodeproj \
            -scheme BranchSDK \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" | xcpretty && exit ${PIPESTATUS[0]}
      - name: Build BranchSDK for iOS device (generic, unsigned)
        run: |
          xcodebuild build \
            -project BranchSDK.xcodeproj \
            -scheme BranchSDK \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" | xcpretty && exit ${PIPESTATUS[0]}
      - name: Build BranchSDK-tvOS for tvOS Simulator (generic)
        run: |
          xcodebuild build \
            -project BranchSDK.xcodeproj \
            -scheme BranchSDK-tvOS \
            -destination "generic/platform=tvOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" | xcpretty && exit ${PIPESTATUS[0]}
      - name: Run unit tests
        run: |
          echo "branch=${{ github.ref }}" >> $GITHUB_OUTPUT
          ./scripts/getSimulator
          SIM_NAME="$(cat ./iphoneSim)"
          rm -rf ./TestResults.xcresult
          DESTINATION="platform=iOS Simulator,name=$SIM_NAME,OS=latest"
          xcodebuild test \
            -project BranchSDK.xcodeproj \
            -scheme BranchSDKTests \
            -destination "$DESTINATION" \
            -testPlan BranchSDKTests \
            -resultBundlePath ./TestResults.xcresult \
            -enableCodeCoverage NO \
            -parallel-testing-enabled NO \
            -collect-test-diagnostics never | xcpretty && exit ${PIPESTATUS[0]}
