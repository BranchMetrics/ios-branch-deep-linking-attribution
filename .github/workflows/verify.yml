name: Unit tests

on:
  push:
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      runner:
        description: Runner label, applies to the Xcode 27 job only (the Xcode 16 job ignores it)
        type: choice
        default: xcode-27
        options:
          - xcode-27
          - macos-26
          - macos-15
      xcode_version:
        description: Xcode version, applies to the Xcode 27 job only (the Xcode 16 job ignores it); must exist on the chosen image
        type: string
        default: "27.0"

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@v6
      - name: Run unit tests
        run: |
          echo "branch=${{ github.ref }}" >> $GITHUB_OUTPUT
          ./scripts/getSimulator
          DESTINATION="platform=iOS Simulator,name=$(cat ./iphoneSim),OS=latest"
          xcodebuild test \
            -project BranchSDK.xcodeproj \
            -scheme BranchSDKTests \
            -destination "$DESTINATION" \
            -testPlan BranchSDKTests | xcpretty && exit ${PIPESTATUS[0]}

  # Xcode 27 sibling of `verify`.
  # Non-blocking (continue-on-error): xcode-27 is a preview runner image.
  verify-xcode27:
    runs-on: ${{ inputs.runner || 'xcode-27' }}
    timeout-minutes: 35
    continue-on-error: true
    concurrency:
      group: verify-xcode27-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out code
        uses: actions/checkout@v6
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ inputs.xcode_version || '27.0' }}
      - name: Build BranchSDK for iOS Simulator (generic)
        run: |
          xcodebuild build \
            -project BranchSDK.xcodeproj \
            -scheme BranchSDK \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" | xcpretty && exit ${PIPESTATUS[0]}
      - name: Build BranchSDK for iOS device (generic, unsigned)
        run: |
          xcodebuild build \
            -project BranchSDK.xcodeproj \
            -scheme BranchSDK \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" | xcpretty && exit ${PIPESTATUS[0]}
      - name: Build BranchSDK-tvOS for tvOS Simulator (generic)
        run: |
          xcodebuild build \
            -project BranchSDK.xcodeproj \
            -scheme BranchSDK-tvOS \
            -destination "generic/platform=tvOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" | xcpretty && exit ${PIPESTATUS[0]}
      - name: Run unit tests
        run: |
          ./scripts/getSimulator
          SIM_NAME="$(cat ./iphoneSim)"
          rm -rf ./TestResults.xcresult
          DESTINATION="platform=iOS Simulator,name=$SIM_NAME,OS=latest"
          # -collect-test-diagnostics never: avoids Xcode 27's fixed 600 s post-test
          # diagnostics wait, which on-failure still hits on a passing run.
          xcodebuild test \
            -project BranchSDK.xcodeproj \
            -scheme BranchSDKTests \
            -destination "$DESTINATION" \
            -testPlan BranchSDKTests \
            -resultBundlePath ./TestResults.xcresult \
            -enableCodeCoverage NO \
            -parallel-testing-enabled NO \
            -collect-test-diagnostics never | xcpretty && exit ${PIPESTATUS[0]}
