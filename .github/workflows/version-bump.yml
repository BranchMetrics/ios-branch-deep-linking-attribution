name: Version bump (manual)

# Manually triggered
# $ gh workflow run -f version=4.0.0-beta.3 version-bump.yml
# $ gh workflow run -f version=prerelease version-bump.yml
on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to use for this bump (e.g. 4.0.0-beta.3), or prerelease, patch, minor or major.
        required: false
        default: prerelease

jobs:
  version-bump:
    runs-on: macos-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6
      - name: Configure git
        run: |
          git config user.name "Branch SDK Team"
          git config user.email branch-sdks@branch.io
      # Does not tag
      - name: Perform version bump & commit
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          case "$VERSION" in
          prerelease) ./scripts/version.sh -i ;;
          patch)      ./scripts/version.sh -i -p ;;
          minor)      ./scripts/version.sh -i -m ;;
          major)      ./scripts/version.sh -i -M ;;
          *)          ./scripts/version.sh -s "$VERSION" ;;
          esac
          new_version=$(./scripts/version.sh)
          git add scripts/version.sh Sources/BranchSDK/BNCConfig.m BranchSDK.podspec BranchSDK.xcodeproj/project.pbxproj
          git commit -m "Updated version to $new_version"
      - name: Push changes
        run: |
          git push
